seed: 42
experiment: paris_streetview_seed42
data:
  train_manifest: manifests/paris_train.jsonl
  validation_manifest: manifests/paris_validation.jsonl
  test_manifest: manifests/paris_test.jsonl
  image_size: 256
  validity_mask_semantics: "1=observed, 0=missing"
  mask_seed: 2026
model:
  base_channels: 64
  attention_heads: 4
  retain_ratio: 0.10
  csam_temperature: 0.07
  residual_scale: 0.25
training:
  epochs: 100
  batch_size: 16
  optimizer: Adam
  learning_rate: 0.0002
  beta1: 0.5
  beta2: 0.999
  lambda_frequency: 0.10
  lambda_edge: 0.10
evaluation:
  primary_region: hole
  metrics: [PSNR, SSIM, LPIPS, FID, edge_MAE]
  warmup_passes: 50
  timing_passes: 500
